[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careerfit-backend"
version = "0.2.0"
description = "CareerFit — Career × Job Fit Analyzer (backend)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bja001219", email = "bja001219@gmail.com" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]
live = [
  "google-genai>=0.3",
  "openai>=1.40",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
